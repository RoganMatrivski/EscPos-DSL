name: Publish Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version override (e.g. 0.1.0). Leave empty to use tag or Cargo.toml version.'
        required: false
        type: string

permissions:
  contents: write

jobs:
  publish-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine package version
        id: get_version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(grep -m1 '^version =' Cargo.toml | cut -d '"' -f 2)
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "Resolved version: ${VERSION}"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android

      - name: Setup Android NDK
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install boltffi CLI
        run: |
          cargo install boltffi_cli --version 0.29.3 || cargo install boltffi_cli

      - name: Build and pack Android with boltffi
        run: |
          boltffi pack android --release

      - name: Sync generated Android bindings
        run: |
          mkdir -p ffi/android/library/src/main/java ffi/android/library/src/main/jniLibs ffi/android/library/src/main/resources/META-INF
          if [ -d "dist/android/kotlin/id" ]; then
            cp -r dist/android/kotlin/id ffi/android/library/src/main/java/
          fi
          if [ -d "dist/android/jniLibs" ]; then
            cp -r dist/android/jniLibs/* ffi/android/library/src/main/jniLibs/
          fi
          cp LICENSE-MIT ffi/android/library/src/main/resources/META-INF/ || true
          cp LICENSE-APACHE ffi/android/library/src/main/resources/META-INF/ || true

      - name: Publish Android Package to Maven Central (Sonatype)
        run: |
          cd ffi/android
          chmod +x gradlew
          ./gradlew publishAndReleaseToMavenCentral --no-configuration-cache -Pversion="${{ steps.get_version.outputs.VERSION }}"
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.SONATYPE_USERNAME || secrets.MAVEN_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.SONATYPE_PASSWORD || secrets.MAVEN_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_SECRET_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.GPG_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PASSPHRASE }}
          ORG_GRADLE_PROJECT_signingInMemoryPassword: ${{ secrets.GPG_PASSPHRASE }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.GPG_PASSPHRASE }}

      - name: Upload AAR to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ffi/android/library/build/outputs/aar/*.aar

  build-csharp-native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos' && 'x86_64-apple-darwin, aarch64-apple-darwin' || matrix.platform == 'windows' && 'x86_64-pc-windows-msvc, aarch64-pc-windows-msvc' || 'x86_64-unknown-linux-gnu' }}

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install boltffi CLI
        run: |
          cargo install boltffi_cli --version 0.29.3 || cargo install boltffi_cli

      - name: Build and pack C# with boltffi
        run: |
          boltffi pack csharp --release --overlay .github/boltffi-${{ matrix.platform }}.toml

      - name: Upload C# dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: csharp-dist-${{ matrix.platform }}
          path: dist/csharp/

  publish-nuget:
    needs: build-csharp-native
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine package version
        id: get_version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(grep -m1 '^version =' Cargo.toml | cut -d '"' -f 2)
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "Resolved version: ${VERSION}"

      - name: Download C# build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: csharp-dist-*
          path: artifacts/
          merge-multiple: true

      - name: Consolidate C# dist directory
        run: |
          mkdir -p dist/csharp
          cp -rn artifacts/* dist/csharp/ || true
          cp LICENSE-MIT dist/csharp/ || true
          cp LICENSE-APACHE dist/csharp/ || true

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build NuGet Package
        run: |
          dotnet pack dist/csharp/BoltFFI.CSharp.csproj -c Release \
            -p:Version="${{ steps.get_version.outputs.VERSION }}" \
            -p:PackageLicenseExpression="MIT OR Apache-2.0" \
            -o dist/csharp/nupkg

      - name: NuGet login via OIDC (Trusted Publishing)
        uses: NuGet/login@v1
        id: login
        continue-on-error: true
        with:
          user: ${{ secrets.NUGET_USER || github.repository_owner }}

      - name: Publish to NuGet.org
        run: |
          API_KEY="${{ steps.login.outputs.NUGET_API_KEY }}"
          if [ -z "$API_KEY" ]; then
            API_KEY="${{ secrets.NUGET_API_KEY }}"
          fi
          if [ -z "$API_KEY" ]; then
            echo "Error: Neither Trusted Publishing OIDC login nor NUGET_API_KEY secret is available."
            exit 1
          fi
          dotnet nuget push dist/csharp/nupkg/*.nupkg \
            --source "https://api.nuget.org/v3/index.json" \
            --api-key "$API_KEY" \
            --skip-duplicate

      - name: Upload NuGet Package to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/csharp/nupkg/*.nupkg


