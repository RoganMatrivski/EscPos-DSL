name: Publish Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version override (e.g. 0.1.0). Leave empty to use tag or Cargo.toml version.'
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine package version
        id: get_version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(grep -m1 '^version =' Cargo.toml | cut -d '"' -f 2)
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "Resolved version: ${VERSION}"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android

      - name: Setup Android NDK
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install boltffi
        run: |
          cargo install boltffi --version 0.29.3 || cargo install boltffi

      - name: Build libraries with boltffi
        run: |
          boltffi build --release

      - name: Sync generated Android bindings
        run: |
          mkdir -p ffi/android/library/src/main/java ffi/android/library/src/main/jniLibs
          if [ -d "dist/android/kotlin/id" ]; then
            cp -r dist/android/kotlin/id ffi/android/library/src/main/java/
          fi
          if [ -d "dist/android/jniLibs" ]; then
            cp -r dist/android/jniLibs/* ffi/android/library/src/main/jniLibs/
          fi

      - name: Publish Android Package to GitHub Packages (Maven)
        run: |
          cd ffi/android
          chmod +x gradlew
          ./gradlew publish -Pversion="${{ steps.get_version.outputs.VERSION }}"
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Build and Publish NuGet Package to GitHub Packages
        run: |
          dotnet pack dist/csharp/BoltFFI.CSharp.csproj -c Release -p:Version="${{ steps.get_version.outputs.VERSION }}" -o dist/csharp/nupkg
          dotnet nuget push dist/csharp/nupkg/*.nupkg \
            --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --api-key "${{ secrets.GITHUB_TOKEN }}" \
            --skip-duplicate
